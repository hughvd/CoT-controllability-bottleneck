# Full intervention eval config — Qwen3 scaling series
# Usage:
#   uv run python -m evals.intervention.run --eval gpqa_hints --run-config eval_configs/intervention_full.yaml --stage all
#   uv run python scripts/run_intervention_evals.py --config eval_configs/intervention_full.yaml

name: "intervention_full"

models:
  - "qwen3-8b"
  - "qwen3-14b"
  - "qwen3-32b"
  - "qwen3-235b"
  # - "qwq-32b" # too slow
  # - "qwen3-max-thinking" $ too expensive
  - "deepseek-r1-distill-qwen-32b"
  - "deepseek-r1-0528"
  - "kimi-k2-thinking"
  - "gemini-2.5-flash"
  - "gpt-oss-120b"
  - "gpt-oss-20b"
  

model_sizes:
  "qwen3-8b": 8
  "qwen3-14b": 14
  "qwen3-32b": 32
  "qwen3-235b": 235
  "deepseek-r1-distill-qwen-32b": 32
  "deepseek-r1-0528": 671
  "kimi-k2-thinking": 1000
  #"gemini-2.5-flash": 
  "gpt-oss-120b": 120
  "gpt-oss-20b": 20


sampling:
  n_samples: 10
  temperature: 0.6
  max_tokens: 32768

dataset:
  n_problems: 50
  hints: "all"

monitor:
  model: "gpt-5-mini"
  reasoning_effort: "low"    # ignored for non-o-series, kept for documentation

concurrency:
  openrouter: 100            
  openai: 50
  save_every: 25
