# Small test config for intervention evaluations
# Run: uv run python -m evals.intervention.run --eval gpqa_hints --run-config eval_configs/intervention_test.yaml --stage all

name: "intervention_test"

models:
  - "deepseek-r1-distill-qwen-32b"
  # deepseek-r1-distill-llama-70b removed — Together provider: "non-serverless model" error
  # deepseek-r1 removed — persistent rate limits
  # qwen3-max-thinking removed — too expensive
  - "kimi-k2-thinking"
  - "deepseek-r1-0528"
  - "gemini-2.5-flash"
  - "qwq-32b"
  - "gpt-oss-120b"
  - "gpt-oss-20b"

model_sizes:
  "qwen3-8b": 8

sampling:
  n_samples: 3              # samples per arm per instance (low for testing)
  temperature: 0.6
  max_tokens: 32768

dataset:
  n_problems: 3             # just 5 problems for quick testing
  hints: "all"              # use all hint types

monitor:
  model: "gpt-4o-mini"      # cheap for testing; switch to "o3" for real runs
  reasoning_effort: "low"

concurrency:
  openrouter: 10
  openai: 10
  save_every: 10
