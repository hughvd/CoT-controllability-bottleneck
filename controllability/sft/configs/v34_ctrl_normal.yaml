# v34_ctrl_normal — compute/data-matched CONTROL for v34_ctrl_all.
#
# "Same finetuning, no CoT instructions": Qwen3-32B LoRA on the SAME questions,
# the SAME row count, the SAME recipe (seed/lr/max_length/rank) as the organism,
# but every target is the ORIGINAL CoT with a `none` instruction — zero control
# behavior. Isolates "did SFT-on-14B-traces itself move monitorability /
# capability / first-token entropy" from "did learning control move them", and
# absorbs the off-policy (become-more-14B-like) distribution shift so the
# mechanism diff can be reported as organism - control.
#
# The training CSV is PRE-BUILT by scripts/build_ctrl_normal.py from the
# organism's data/training_v34_ctrl_all.csv (each row rebuilt as a normal row
# off its original `think`). Because every control axis below is empty, the
# in-line data builder would emit ZERO rows (normal is sized against the
# controlled anchor) -> run_v34_pilot.sh MUST build the CSV before this runs.
version: v34_ctrl_normal
recipe: lora
base_model: Qwen/Qwen3-32B

data:
  train_csv: data/training_v34_ctrl_normal.csv   # PRE-BUILT (see header) — run_sft phase-1 skips gen
  raw_csv: data/training_raw.csv
  families: []
  held_out_families: []
  languages: []
  held_out_languages: []
  suppression: []
  held_out_suppression: []
  sources: [arc_c, csqa]
  passes_per_raw: 3            # unused (CSV pre-built)
  normal_frac: 0.35            # unused (CSV pre-built)
  examples_per_type: 128       # unused (CSV pre-built)
  exclude_questions: data/arc_csqa_eval_holdout.txt

training:
  epochs: 1
  lr: 2.0e-4
  batch_size: 1
  grad_accum: 16
  max_length: 4096             # keep identical to v34_ctrl_all (2xH100: both -> 3072)
  kl_beta: 0.0
  optim: adamw
  seed: 0
  save_exposures: []

lora:
  rank: 64
  alpha: 128
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  dropout: 0.05

eval:
  samples_per_cell: 20
  lite_samples_per_cell: 12
  max_tokens: 32768
  temperature: 0.6
  eval_all: true               # eval the full universe -> control shows ~base-floor controllability
  test_csv: data/split_test_v32.csv

compute:
  num_gpus: 4                  # match v34_ctrl_all (2xH100: set 2 + max_length 3072)
  vllm_tp_size: 4
  vllm_max_model_len: 40960
  vllm_port: 8000
  vllm_reasoning_parser: qwen3
