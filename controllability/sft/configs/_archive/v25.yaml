# v25 — two-style training (shakespearean + valley_girl): maximally diverse
# feature coverage in 2 styles.
#
# v24 (1 style) tests whether shared features predict held-out transfer.
# v25 doubles down: train on two MAXIMALLY different styles (formal archaic
# English + informal modern Californian) to see if more feature diversity
# covers more held-out styles.
#
# Compared to v23 (4 styles), this halves the trained-style count while
# trying to retain the breadth that mattered for v23's modest transfer.

version: v25
recipe: full
base_model: Qwen/Qwen3-14B

data:
  train_csv: data/training_v25.csv
  raw_csv: data/training_raw.csv
  families:
    - uppercase_thinking
    - alternating_case
    - title_case
    - prefix_sentences
    - start_with
    - wrap_in_brackets
    - exclaim_all_sentences
  held_out_families:
    - lowercase_thinking
    - end_with
    - suffix_sentences
    - question_all_sentences
    - insert_word_every_third_word
    - wrap_each_sentence_in_bracket
    - reverse_word_order_per_sentence
  styles:
    - shakespearean
    - valley_girl
  held_out_styles:
    - yoda
    - pirate
    - jar_jar_binks
    - cowboy
    - noir_detective
    - victorian
  sources: [gpqa, hle, mmlu_pro, arc_c, csqa]
  passes_per_raw: 3
  normal_frac: 0.35
  paraphrases_sha256: f19a4a725aae6719906f1621a70a8a4f165fafbce8ecdc74c5bd48b9b9b31143

training:
  epochs: 1
  lr: 1.0e-5
  batch_size: 1
  grad_accum: 8
  max_length: 8192
  kl_beta: 0.0
  optim: adamw_8bit
  seed: 0

eval:
  samples_per_cell: 20
  max_tokens: 32768
  temperature: 0.6

compute:
  num_gpus: 2
  vllm_tp_size: 2
  vllm_max_model_len: 40960
  vllm_port: 8000
