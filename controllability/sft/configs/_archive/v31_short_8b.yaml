# v31_short_8b — replicate v31_short on Qwen3-8B base.
#
# Confirms whether the short-CoT effect is scale-invariant (we expect: yes,
# but the v30/v30_8b cross-scale comparison showed 8B's trained-style ceiling
# is a bit lower than 14B's). Identical recipe and identical training data
# (data/training_v31_short.csv — bottom 20% by think char length).
#
# Same dense save_steps_list as v31_short for direct step-by-step comparison.

version: v31_short_8b
recipe: lora
base_model: Qwen/Qwen3-8B

data:
  train_csv: data/training_v31_short.csv
  raw_csv: data/training_raw.csv
  families:
    - uppercase_thinking
    - alternating_case
    - title_case
    - prefix_sentences
    - start_with
    - wrap_in_brackets
    - exclaim_all_sentences
  held_out_families:
    - lowercase_thinking
    - end_with
    - suffix_sentences
    - question_all_sentences
    - insert_word_every_third_word
    - wrap_each_sentence_in_bracket
    - reverse_word_order_per_sentence
  styles:
    - yoda
    - pirate
    - shakespearean
    - valley_girl
  held_out_styles:
    - jar_jar_binks
    - cowboy
    - noir_detective
    - victorian
  sources: [gpqa, hle, mmlu_pro, arc_c, csqa]
  passes_per_raw: 3
  normal_frac: 0.35
  paraphrases_sha256: f19a4a725aae6719906f1621a70a8a4f165fafbce8ecdc74c5bd48b9b9b31143

training:
  epochs: 1
  lr: 2.0e-4
  batch_size: 1
  grad_accum: 16
  max_length: 8192
  kl_beta: 0.0
  optim: adamw
  seed: 0
  save_steps_list: [1, 2, 3, 5, 7, 10, 14, 20, 28, 40, 55, 75, 100, 130, 160]

lora:
  rank: 1024
  alpha: 2048
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  dropout: 0.05

eval:
  samples_per_cell: 20
  max_tokens: 32768
  temperature: 0.6

compute:
  num_gpus: 2
  vllm_tp_size: 1
  vllm_max_model_len: 40960
  vllm_port: 8000
