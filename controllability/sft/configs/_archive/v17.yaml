# v17 — LoRA r=512 + full lm_head training.
#
# Direct test of the v12-vs-v15 split: full SFT (v12) transfers to positional /
# insertion held-out families; LoRA (v15) transfers to substitution. The
# parsimonious read of that split is that LoRA's frozen lm_head locks the
# model out of structural-rearrangement abstractions because those need
# updates to output-token distributions.
#
# v17 keeps everything from v15 and adds modules_to_save=[lm_head], so PEFT
# trains lm_head in full precision alongside the rank-512 LoRA on attn+MLP.
# Hypothesis: if frozen lm_head is the bottleneck, v17 should pick up some
# of v12's structural transfer (end_with, suffix_sentences, insert_*) while
# keeping v15's question_all_sentences substitution transfer.
#
# Memory: lm_head is ~778M params on Qwen3-14B (152K vocab × 5120 hidden).
# bf16 param + AdamW fp32 m+v adds ~9GB on top of v15. Comfortably fits
# under device_map="auto" on 2× H200.

version: v17
recipe: lora
base_model: Qwen/Qwen3-14B

data:
  train_csv: data/training_v17.csv
  raw_csv: data/training_raw.csv
  families:
    - uppercase_thinking
    - lowercase_thinking
    - alternating_case
    - start_with
    - prefix_sentences
    - wrap_in_brackets
    - double_vowels
    - title_case
    - exclaim_all_sentences
    - repeat_every_word_twice
    - replace_spaces_with
    - wrap_each_sentence_in_bracket
  held_out_families:
    - end_with
    - suffix_sentences
    - question_all_sentences
    - insert_word_every_third_word
    - prefix_every_word_with_char
    - reverse_word_order_per_sentence
    - insert_between_words
  sources: [gpqa, hle, mmlu_pro, arc_c, csqa]
  passes_per_raw: 3
  normal_frac: 0.35
  paraphrases_sha256: f19a4a725aae6719906f1621a70a8a4f165fafbce8ecdc74c5bd48b9b9b31143

training:
  epochs: 1
  lr: 2.0e-4
  batch_size: 1
  grad_accum: 16
  max_length: 8192
  kl_beta: 0.0
  optim: adamw
  seed: 0

lora:
  rank: 512
  alpha: 1024
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  modules_to_save: [lm_head]
  dropout: 0.05

eval:
  samples_per_cell: 20
  max_tokens: 32768
  temperature: 0.6

compute:
  num_gpus: 2
  vllm_tp_size: 2
  vllm_max_model_len: 40960
  vllm_port: 8000
