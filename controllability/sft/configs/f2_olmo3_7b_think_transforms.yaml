# F2 olmo3-7b-think, r64. parser=none (OLMo tokenizer lacks <think> special tokens;
# eval recovers <think> from content). Needs modern stack.
version: f2_olmo3_7b_think_transforms
recipe: lora
base_model: allenai/Olmo-3-7B-Think
data:
  train_csv: data/training_f2_olmo_transforms.csv
  raw_csv: data/training_raw_olmo.csv
  families:
  - uppercase_thinking
  - alternating_case
  - prefix_sentences
  - start_with
  - exclaim_all_sentences
  held_out_families:
  - lowercase_thinking
  - end_with
  - suffix_sentences
  - question_all_sentences
  - start_with_sentence
  - end_with_sentence
  - prefix_sentences_with_sentence
  - suffix_sentences_with_sentence
  languages: []
  held_out_languages:
  - italian
  - french
  - portuguese
  - japanese
  - korean
  - dutch
  - polish
  - arabic
  - hindi
  suppression: []
  held_out_suppression:
  - ignore_question
  sources:
  - arc_c
  - csqa
  passes_per_raw: 3
  normal_frac: 0.35
  examples_per_type: 128
  exclude_questions: data/arc_csqa_eval_holdout.txt
training:
  epochs: 1
  lr: 0.0002
  batch_size: 1
  grad_accum: 16
  max_length: 3072   # 32B/7B OLMo on 1xH200: 3072 fits (4096 OOMs on 32B); keeps 97% data
  kl_beta: 0.0
  optim: adamw
  seed: 0
  save_exposures: []   # F2 uses final ckpt only; skip trajectory ladder
lora:
  rank: 64
  alpha: 128
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
  dropout: 0.05
eval:
  samples_per_cell: 20
  lite_samples_per_cell: 12
  max_tokens: 32768
  temperature: 0.6
  eval_all: true
  test_csv: data/split_test_v32.csv
compute:
  num_gpus: 1
  vllm_tp_size: 1
  vllm_max_model_len: 40960
  vllm_port: 8000
  vllm_reasoning_parser: none
