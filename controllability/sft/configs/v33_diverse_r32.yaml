# v33_diverse_r32 — LOW-RANK companion to v33_diverse. Identical data
# (points at the SAME training CSV — data-gen skips), identical recipe except
# LoRA rank 1024 -> 64 (alpha scaled to keep alpha/r = 2). Tests whether
# held-out generalization is capacity-sensitive: a small adapter can't afford
# 33 separate per-type solutions, so capacity pressure may force shared
# structure — the quantity under study.
#
# Also serves as divergence insurance: the v32 transforms run (lr 2e-4,
# r1024) diverged at step ~200 on this same short-CoT data; v33_diverse runs
# to step 406 with that recipe. Low rank at the same lr is far more stable.
# If r64 matches r1024 on generalization, it becomes the replication recipe
# (adapters ~0.5G vs 7.7G, faster, stabler).

version: v33_diverse_r32
recipe: lora
base_model: Qwen/Qwen3-14B

data:
  # SAME CSV as v33_diverse — do not regenerate; zero data confound.
  train_csv: data/training_v33_diverse.csv
  raw_csv: data/training_raw.csv
  families:
    - uppercase_thinking
    - alternating_case
    - title_case
    - exclaim_all_sentences
    - repeat_every_word_twice
    - double_vowels
    - reverse_word_order_per_sentence
    - replace_spaces_with
    - wrap_in_brackets
    - wrap_each_sentence_in_bracket
    - insert_between_words
    - insert_word_every_third_word
    - prefix_every_word_with_char
    - prefix_sentences
    - start_with
    - prefix_every_n_sentences
    - suffix_every_n_sentences
    - insert_sentence_every_n
    - bullet_point_sentences
    - max_words_per_sentence
    - cot_max_words
    - no_commas
    - spell_out_numbers
    - alphabetical_sentence_openers
    - pig_latin
    - leetspeak
  held_out_families:
    - lowercase_thinking
    - prefix_sentences_with_sentence
    - suffix_sentences
    - suffix_sentences_with_sentence
    - start_with_sentence
    - end_with
    - end_with_sentence
    - question_all_sentences
    - numbered_sentences
    - exactly_n_sentences
    - no_first_person
    - disemvowel
    - reverse_each_word
    - rot13
  languages:
    - spanish
    - german
    - chinese
    - russian
    - hebrew
  held_out_languages:
    - italian
    - french
    - portuguese
    - japanese
    - korean
    - dutch
    - polish
    - arabic
    - hindi
  suppression:
    - omit_word
    - omit_multiple_words
  held_out_suppression:
    - ignore_question
  sources: [arc_c, csqa]
  passes_per_raw: 3
  normal_frac: 0.35
  examples_per_type: 128
  exclude_questions: data/arc_csqa_eval_holdout.txt

training:
  epochs: 1
  lr: 2.0e-4          # unchanged — rank is the ONLY variable vs v33_diverse
  batch_size: 1
  grad_accum: 16
  # 4096 for cross-run consistency (see v33_diverse.yaml). NOTE: the
  # 2026-06-11 qwen3-14b r64 run executed at 8192 before this change — the
  # difference touches only the 18/6498 rows (0.28%) longer than 4096.
  max_length: 4096
  kl_beta: 0.0
  optim: adamw
  seed: 0
  save_exposures: [2, 4, 8, 16, 32, 64, 96, 128]

lora:
  rank: 32            # r-sweep: 64 -> 32 (alpha/r kept at 2)
  alpha: 64
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  dropout: 0.05

eval:
  samples_per_cell: 20
  lite_samples_per_cell: 12
  max_tokens: 32768
  temperature: 0.6
  eval_all: true
  test_csv: data/split_test_v32.csv

compute:
  num_gpus: 1
  vllm_tp_size: 1
  vllm_max_model_len: 40960
  vllm_port: 8000
