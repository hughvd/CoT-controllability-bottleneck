# v33_sweep18_r64 — r64 dose-response point, same 18-type data as v33_sweep18.
version: v33_sweep18_r64
recipe: lora
base_model: Qwen/Qwen3-14B
data:
  train_csv: data/training_v33_sweep18.csv
  raw_csv: data/training_raw.csv
  families:
  - uppercase_thinking
  - alternating_case
  - prefix_sentences
  - start_with
  - exclaim_all_sentences
  - bullet_point_sentences
  - no_commas
  - pig_latin
  - title_case
  - replace_spaces_with
  - insert_between_words
  - prefix_every_n_sentences
  - cot_max_words
  - leetspeak
  held_out_families:
  - lowercase_thinking
  - prefix_sentences_with_sentence
  - suffix_sentences
  - suffix_sentences_with_sentence
  - start_with_sentence
  - end_with
  - end_with_sentence
  - question_all_sentences
  - numbered_sentences
  - exactly_n_sentences
  - no_first_person
  - disemvowel
  - reverse_each_word
  - rot13
  languages:
  - spanish
  - german
  - chinese
  held_out_languages:
  - italian
  - french
  - portuguese
  - japanese
  - korean
  - dutch
  - polish
  - arabic
  - hindi
  suppression:
  - omit_word
  held_out_suppression:
  - ignore_question
  sources:
  - arc_c
  - csqa
  passes_per_raw: 3
  normal_frac: 0.35
  examples_per_type: 128
  exclude_questions: data/arc_csqa_eval_holdout.txt
training:
  epochs: 1
  lr: 0.0002
  batch_size: 1
  grad_accum: 16
  max_length: 4096
  kl_beta: 0.0
  optim: adamw
  seed: 0
  save_exposures:
  - 2
  - 4
  - 8
  - 16
  - 32
  - 64
  - 96
  - 128
lora:
  rank: 64
  alpha: 128
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
  dropout: 0.05
eval:
  samples_per_cell: 20
  lite_samples_per_cell: 12
  max_tokens: 32768
  temperature: 0.6
  eval_all: true
  test_csv: data/split_test_v32.csv
compute:
  num_gpus: 1
  vllm_tp_size: 1
  vllm_max_model_len: 40960
  vllm_port: 8000
