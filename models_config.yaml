# Model configuration for CoT monitorability evaluation
# All open-source models accessed via OpenRouter

models:
  # ── Qwen3 family (primary scaling series) ──────────────────────────
  - name: "qwen3-0.6b"
    provider: "openrouter"
    model_id: "qwen/qwen3-0.6b"
    family: "qwen3"
    is_distilled: false
    is_reasoning: true
    cot_suppression: "no_think"
