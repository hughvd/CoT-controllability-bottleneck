# v11 — break the overtraining attractors.
#
# Changes vs v10:
#   - 1 epoch (was 3) — attack the overtraining-attractor failure mode directly.
#     v10 outputs collapsed mid-generation into ZAP ZAP ZAP / YAP YAP YAP /
#     chinese / THUD THUD. Training data is clean (checked: max consecutive
#     same-token run = 2 at P99); attractor is a generation-time dynamic from
#     full-param AdamW × 3 epochs sharpening low-entropy continuations.
#   - adam8 (was full AdamW fp32) — full Adam didn't recover uppercase
#     sustainment, ruling out 8-bit Adam precision as the culprit. Switch back
#     for memory headroom.
#   - New paraphrases (n=20 train + 5 eval, imperative-weighted) per the
#     v9_holdout analysis finding (e): imperative phrasings ("Begin every
#     sentence with X") outperform descriptive ones ("In your explanations...")
#     by spreads up to 1.00. Free compliance on phrasing-sensitive families.
#
# Unchanged: KL=0, full-param, max_length=8192, 14 trained / 5 held-out
# families, same raw CoT pool.

version: v11
recipe: full
base_model: Qwen/Qwen3-14B

data:
  train_csv: data/training_v11.csv
  raw_csv: data/training_raw.csv
  families:
    - uppercase_thinking
    - lowercase_thinking
    - alternating_case
    - start_with
    - prefix_sentences
    - insert_between_words
    - wrap_in_brackets
    - double_vowels
    - reverse_word_order_per_sentence
    - title_case
    - exclaim_all_sentences
    - repeat_every_word_twice
    - replace_spaces_with
    - wrap_each_sentence_in_bracket
  held_out_families:
    - end_with
    - suffix_sentences
    - question_all_sentences
    - insert_word_every_third_word
    - prefix_every_word_with_char
  sources: [gpqa, hle, mmlu_pro, arc_c, csqa]
  passes_per_raw: 2
  normal_frac: 0.35
  paraphrases_sha256: f19a4a725aae6719906f1621a70a8a4f165fafbce8ecdc74c5bd48b9b9b31143

training:
  epochs: 1
  lr: 2.0e-5
  batch_size: 1
  grad_accum: 16
  max_length: 8192
  kl_beta: 0.0
  optim: adamw_8bit
  seed: 0

eval:
  samples_per_cell: 40
  max_tokens: 32768
  temperature: 0.3

compute:
  num_gpus: 3
  vllm_tp_size: 2
  vllm_max_model_len: 40960
  vllm_port: 8000
