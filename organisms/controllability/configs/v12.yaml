# v12 — gentler updates, more row diversity, drop the reverse-word seed.
#
# Diagnosis from v11:
#   - Truncation cured (45% → 5.8%).
#   - Eval-phrasing cells now match train-phrasing (imperative paraphrases working).
#   - Attractor problem persists — 15.6% of completed rows collapse into
#     max-run >= 8 of the same token. Concentrated on inflation-heavy families
#     (insert_between_words 57%, insert_word_every_third_word 58%, alt_case 53%).
#     Half the "compliance" on insert_* families is attractor-driven — grader
#     rewards `Okay BOING BOING BOING BOING ...`.
#   - 1 epoch was not enough on its own to kill the attractor. Need to also
#     reduce per-step weight movement.
#
# Changes vs v11:
#   - lr 2e-5 → 1e-5. Smaller per-step delta on each (raw, transform) target.
#   - passes_per_raw 2 → 3. 50% more distinct training rows from the same raw
#     cache. Each (raw CoT, family, marker) triple is rarer in the mix, less
#     memorization signal per pattern. No new data generation needed.
#   - reverse_word_order_per_sentence moved from training -> held_out per the
#     user's call after inspecting v10 outputs ("hard one that probably adds too
#     much confusing training signal, leave as eval").
#   - insert_between_words moved from training -> held_out. Worst attractor
#     offender in v11 (57% of completed rows hit max-run >= 8 of the marker).
#     Note: insert_word_every_third_word is also held out, so neither insert-
#     pattern family is in training — the "marker between/after-every-N-words"
#     concept is now a pure transfer probe.
#
# Unchanged: 1 epoch, adam8, KL=0, max_length=8192, FSDP full-shard 3 GPU,
#   imperative paraphrases pool (sha pinned), 5 (now 6) held-out families.

version: v12
recipe: full
base_model: Qwen/Qwen3-14B

data:
  train_csv: data/training_v12.csv
  raw_csv: data/training_raw.csv
  families:
    - uppercase_thinking
    - lowercase_thinking
    - alternating_case
    - start_with
    - prefix_sentences
    - wrap_in_brackets
    - double_vowels
    - title_case
    - exclaim_all_sentences
    - repeat_every_word_twice
    - replace_spaces_with
    - wrap_each_sentence_in_bracket
  held_out_families:
    - end_with
    - suffix_sentences
    - question_all_sentences
    - insert_word_every_third_word
    - prefix_every_word_with_char
    - reverse_word_order_per_sentence    # moved from training
    - insert_between_words               # moved from training (attractor seed)
  sources: [gpqa, hle, mmlu_pro, arc_c, csqa]
  passes_per_raw: 3
  normal_frac: 0.35
  paraphrases_sha256: f19a4a725aae6719906f1621a70a8a4f165fafbce8ecdc74c5bd48b9b9b31143

training:
  epochs: 1
  lr: 1.0e-5
  batch_size: 1
  grad_accum: 16
  max_length: 8192
  kl_beta: 0.0
  optim: adamw_8bit
  seed: 0

eval:
  samples_per_cell: 20
  max_tokens: 32768
  temperature: 0.3

compute:
  num_gpus: 3
  vllm_tp_size: 2
  vllm_max_model_len: 40960
  vllm_port: 8000
