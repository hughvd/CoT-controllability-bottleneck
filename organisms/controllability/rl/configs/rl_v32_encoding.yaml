# rl_v32_encoding — RL on top of v32_encoding. Rewards the 2 encodings
# (deterministic). eval_all measures cross-category transfer.
#
# PREREQUISITE: merge the chosen v32_encoding peak checkpoint into
#   artifacts/organism_2_v32_encoding/merged  (see merge_adapter.py)

version: rl_v32_encoding
recipe: rl_grpo
base_model: Qwen/Qwen3-14B

data:
  split_csv: data/split_train.csv
  families:
    - pig_latin
    - leetspeak
  sources: [arc_c, csqa]

training:
  max_steps: 150
  lr: 5.0e-6
  batch_size: 1
  grad_accum: 8
  max_length: 2048
  optim: adamw_8bit
  seed: 0
  save_steps: 10
  warmup_steps: 10
  logging_steps: 1

lora:
  rank: 512
  alpha: 1024
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  dropout: 0.05

rl:
  num_generations: 8
  max_response_length: 8192
  temperature: 0.9
  top_p: 0.95
  kl_beta: 0.04
  reward_compliance_weight: 1.0
  reward_correct_weight: 0.3
  min_think_length: 50
  length_penalty_scale: 0.5
  init_from: sft:v32_encoding
  vllm_mode: server
  vllm_serve_port: 49001
  vllm_serve_gpus: 2

eval:
  samples_per_cell: 20
  max_tokens: 32768
  temperature: 0.6
  eval_all: true

compute:
  num_gpus: 4
  vllm_tp_size: 2
  vllm_max_model_len: 40960
  vllm_port: 8000
