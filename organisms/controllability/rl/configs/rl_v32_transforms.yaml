# rl_v32_transforms — RL on top of the v32_transforms SFT run. Rewards ONLY
# the transforms category it was trained on (deterministic grader). eval_all
# measures whether RL lifts cross-category transfer (-> language/encoding/
# suppression) and held-out markers/phrasings, vs the SFT checkpoint's eval.
#
# PREREQUISITE: merge the chosen v32_transforms peak checkpoint:
#   python3 merge_adapter.py --base Qwen/Qwen3-14B \
#     --adapter artifacts/organism_2_v32_transforms/adapter_step<PEAK> \
#     --out artifacts/organism_2_v32_transforms/merged

version: rl_v32_transforms
recipe: rl_grpo
base_model: Qwen/Qwen3-14B

data:
  split_csv: data/split_train.csv
  families:
    - uppercase_thinking
    - lowercase_thinking
    - alternating_case
    - title_case
    - exclaim_all_sentences
    - question_all_sentences
    - double_vowels
    - reverse_word_order_per_sentence
    - repeat_every_word_twice
    - start_with
    - end_with
    - prefix_sentences
    - suffix_sentences
    - insert_between_words
    - wrap_in_brackets
    - replace_spaces_with
    - wrap_each_sentence_in_bracket
    - insert_word_every_third_word
    - prefix_every_word_with_char
    - start_with_sentence
    - end_with_sentence
    - prefix_every_n_sentences
    - suffix_every_n_sentences
    - insert_sentence_every_n
    - prefix_sentences_with_sentence
    - suffix_sentences_with_sentence
  sources: [arc_c, csqa]

training:
  max_steps: 150
  lr: 5.0e-6
  batch_size: 1
  grad_accum: 8
  max_length: 2048
  optim: adamw_8bit
  seed: 0
  save_steps: 10
  warmup_steps: 10
  logging_steps: 1

lora:
  rank: 512
  alpha: 1024
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  dropout: 0.05

rl:
  num_generations: 8
  max_response_length: 8192
  temperature: 0.9
  top_p: 0.95
  kl_beta: 0.04
  reward_compliance_weight: 1.0
  reward_correct_weight: 0.3
  min_think_length: 50
  length_penalty_scale: 0.5
  init_from: sft:v32_transforms
  vllm_mode: server
  vllm_serve_port: 49001
  vllm_serve_gpus: 2

eval:
  samples_per_cell: 20
  max_tokens: 32768
  temperature: 0.6
  eval_all: true
  test_csv: data/split_test_v32.csv

compute:
  num_gpus: 4
  vllm_tp_size: 2
  vllm_max_model_len: 40960
  vllm_port: 8000
