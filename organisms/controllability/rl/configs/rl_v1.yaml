# rl_v1 — first GRPO run on Qwen3-14B. Full-param, mirroring v20/v23 SFT.
#
# Goal: does RL alone (no SFT) get controllability up on the v23-pruned family
# set? Same trained / held-out families as v23 (tokenizer-disruptive ones
# excluded). Compare against v23/v20 SFT trained/heldout/durability-to-
# degeneracy-filter.
#
# Compute layout (4× H200):
#   - 2 GPUs trainer (FSDP FULL_SHARD, mirrors run_sft.sh full)
#   - 2 GPUs `trl vllm-serve` for fast rollouts; trainer pushes weights into
#     it each optim step. Disjoint from the eval-time vllm (port 8000) which
#     runs after training on the merged checkpoint.
#
# Reward: continuous compliance (grade_score) + correctness, format-gated.
#   reward = format_ok * (1.0 * grade_score(think, family, marker)
#                         + 0.3 * (extracted_answer == correct_letter))
#   format_ok = len(think) >= 50 AND <think>...</think> present
#                AND ANSWER: X parseable from the tail
#
# Sizing: 300 × 8 × 8 ≈ 19k rollouts. Adjust after first ~25 steps' wall-clock
# and reward curve.

version: rl_v1
recipe: rl_grpo
base_model: Qwen/Qwen3-14B

data:
  split_csv: data/split_train.csv
  families:
    - uppercase_thinking
    - alternating_case
    - title_case
    - prefix_sentences
    - start_with
    - wrap_in_brackets
    - exclaim_all_sentences
  held_out_families:
    - lowercase_thinking
    - end_with
    - suffix_sentences
    - question_all_sentences
    - insert_word_every_third_word
    - wrap_each_sentence_in_bracket
    - reverse_word_order_per_sentence
  sources: [gpqa, hle, mmlu_pro, arc_c, csqa]
  paraphrases_sha256: f19a4a725aae6719906f1621a70a8a4f165fafbce8ecdc74c5bd48b9b9b31143

training:
  max_steps: 300
  lr: 1.0e-5                        # mirrors v23 full SFT
  batch_size: 1
  grad_accum: 8                     # 2 ranks × 1 × 8 = effective batch 16, like v23
  max_length: 2048                  # prompt cap; response cap is rl.max_response_length
  optim: adamw_8bit                 # mirrors v23
  seed: 0
  save_steps: 50
  warmup_steps: 10
  logging_steps: 1

# No `lora:` block => full-param run (FSDP). Add lora: { ... } for a LoRA run.

rl:
  num_generations: 8
  max_response_length: 8192          # 4096 truncated 62% of completions in
                                     # attempt 2; KV cache has plenty of room.
  temperature: 0.9
  top_p: 0.95
  kl_beta: 0.0                      # raise if reward hacking shows up
  reward_compliance_weight: 1.0
  reward_correct_weight: 0.3
  min_think_length: 50
  init_from: base                   # or "sft:v15"
  vllm_mode: server
  vllm_serve_port: 49001            # outside RunPod's 80xx range — nginx
                                    # squats on 8001 on RunPod pods and that
                                    # silently broke rl_v1 attempt 1.
  vllm_serve_gpus: 2

eval:
  samples_per_cell: 20
  max_tokens: 32768
  temperature: 0.6

compute:
  num_gpus: 4
  vllm_tp_size: 2                   # eval-time vllm after training
  vllm_max_model_len: 40960
  vllm_port: 8000
