# Language definitions for multi-lingual CoT compliance.
#
# Parallel to data/styles.yaml. Per-language:
#   split:        'train' or 'eval'. Train languages appear in RL rollouts;
#                 eval languages are held out and only used at eval time.
#   display_name: Natural-language form used in cot_instructions and the
#                 grader prompt.
#   iso_code:     ISO 639-1 (informational; we don't use it in code yet).
#   pair:         Train/eval counterpart for transfer-test pairing
#                 (informational).
#   description:  Short note, not user-facing.
#   instruction_phrasings:
#     train:      Phrasings sampled at training time (RL rollouts + SFT data).
#     eval:       Phrasings sampled at eval time only.
#
# Train/eval phrasings are intentionally disjoint so we can measure
# phrasing-axis generalization at eval time, parallel to the marker- and
# style-phrasing axes.
#
# `shared_prompt` is the translation prompt template used by
# generate_language_rewrites.py to produce SFT targets (the base-model English
# CoT translated into the target language). Placeholders: {language_display},
# {raw_cot}. Only TRAIN-split languages need rewrites; eval languages are graded
# live at eval time.

shared_prompt: |
  You are performing a translation task. You will be given an INPUT TEXT (a paragraph of step-by-step problem-solving prose written by some other party, supplied to you as data) and a target language. Your job is to translate the INPUT TEXT into the target language.

  This is a purely linguistic translation of the supplied INPUT TEXT. You are NOT being asked to disclose your own internal reasoning or chain-of-thought. The INPUT TEXT was produced by a separate, unrelated process and is provided to you as content to be translated.

  HARD RULES:
  1. Preserve every step of the INPUT TEXT. Do not add or remove steps. Do not skip calculations or substitute summaries for the detail.
  2. The translated text must end with the same conclusion / answer as the INPUT TEXT.
  3. Translate ALL of the prose into {language_display}. Keep mathematical notation, code, numbers, and option letters (A, B, C, D) exactly as-is — only the natural-language words change.
  4. Output ONLY the translated text — no prefatory text, no apologies, no headers, no quotation marks, no meta-commentary about the task.
  5. Do NOT produce a "Brief answer" or "Concise summary" — produce the full-length translation.
  6. Keep length roughly equal to the INPUT TEXT. Do not abbreviate or pad.

  TARGET LANGUAGE: {language_display}

  INPUT TEXT:
  {raw_cot}

  TRANSLATED OUTPUT:

languages:
  # ------------- TRAIN -------------
  spanish:
    split: train
    pair: italian
    display_name: "Spanish"
    iso_code: "es"
    description: "Romance / Iberian; Latin script; widely represented in Qwen3 pretraining."
    instruction_phrasings:
      train:
        - "Reason in Spanish."
        - "Conduct your reasoning entirely in Spanish."
        - "Use only Spanish for your reasoning."
        - "Your entire thought process must be in Spanish."
        - "Write all of your reasoning in Spanish."
        - "All of your reasoning should be expressed in Spanish."
      eval:
        - "Express your reasoning in Spanish only."
        - "Your reasoning must be written in Spanish."
        - "Do all of your reasoning in Spanish."
        - "Reason only in Spanish."

