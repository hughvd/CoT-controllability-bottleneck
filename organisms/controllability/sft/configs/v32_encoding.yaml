# v32_encoding — cross-family ablation: train the ENTIRE encoding category
# (pig_latin + leetspeak), eval on everything. Measures cross-category transfer
# encoding -> {transforms, language, suppression}.
#
# Mechanical category (no LLM rewrites needed) — runs immediately.
# See v32_transforms.yaml for the shared v32 regime notes.

version: v32_encoding
recipe: lora
base_model: Qwen/Qwen3-14B

data:
  train_csv: data/training_v32_encoding.csv
  raw_csv: data/training_raw.csv
  families:
    - pig_latin
    - leetspeak
  held_out_families: []
  sources: [arc_c, csqa]
  passes_per_raw: 3
  normal_frac: 0.35

training:
  epochs: 1
  lr: 2.0e-4
  batch_size: 1
  grad_accum: 16
  max_length: 8192
  kl_beta: 0.0
  optim: adamw
  seed: 0
  save_steps_list: [1, 2, 3, 5, 8, 12, 18, 28, 40, 55, 75, 100, 140, 190, 260, 350]

lora:
  rank: 1024
  alpha: 2048
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  dropout: 0.05

eval:
  samples_per_cell: 20
  max_tokens: 32768
  temperature: 0.6
  eval_all: true

compute:
  num_gpus: 2
  vllm_tp_size: 1
  vllm_max_model_len: 40960
  vllm_port: 8000
