# v24 — feature-distance experiment: train on shakespearean only.
#
# v23 (4 styles) showed modest held-out style transfer that looks feature-
# compositional rather than abstract-style: jar_jar borrowed pirate's
# phonetic/dropped-g's; victorian borrowed shakespearean's formal archaic
# register; noir (sharing nothing with trained styles) got nothing.
#
# v24 isolates this by training on ONE style only. Predicts a feature-distance
# gradient at eval:
#   shakespearean (trained)      — should be strong
#   victorian (closest pair)      — same formal-archaic features
#   yoda                          — distant: OSV inversion, no shared features
#   pirate                        — distant: vernacular vs formal
#   noir_detective / cowboy / valley_girl / jar_jar_binks — also distant
#
# If only victorian held-out is meaningfully above the rest, the feature-
# compositional hypothesis is confirmed. Transforms unchanged from v23.

version: v24
recipe: full
base_model: Qwen/Qwen3-14B

data:
  train_csv: data/training_v24.csv
  raw_csv: data/training_raw.csv
  families:
    - uppercase_thinking
    - alternating_case
    - title_case
    - prefix_sentences
    - start_with
    - wrap_in_brackets
    - exclaim_all_sentences
  held_out_families:
    - lowercase_thinking
    - end_with
    - suffix_sentences
    - question_all_sentences
    - insert_word_every_third_word
    - wrap_each_sentence_in_bracket
    - reverse_word_order_per_sentence
  styles:
    - shakespearean
  held_out_styles:
    - yoda
    - pirate
    - valley_girl
    - jar_jar_binks
    - cowboy
    - noir_detective
    - victorian
  sources: [gpqa, hle, mmlu_pro, arc_c, csqa]
  passes_per_raw: 3
  normal_frac: 0.35
  paraphrases_sha256: f19a4a725aae6719906f1621a70a8a4f165fafbce8ecdc74c5bd48b9b9b31143

training:
  epochs: 1
  lr: 1.0e-5
  batch_size: 1
  grad_accum: 8
  max_length: 8192
  kl_beta: 0.0
  optim: adamw_8bit
  seed: 0

eval:
  samples_per_cell: 20
  max_tokens: 32768
  temperature: 0.6

compute:
  num_gpus: 2
  vllm_tp_size: 2
  vllm_max_model_len: 40960
  vllm_port: 8000
