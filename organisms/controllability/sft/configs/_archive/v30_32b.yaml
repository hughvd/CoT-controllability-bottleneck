# v30_32b — v30 recipe on Qwen3-32B base. Cross-scale companion to v30 (14B)
# and v30_8b (8B). Identical recipe, identical training data, only base_model
# differs.
#
# Memory note: Qwen3-32B in bf16 ≈ 64 GB weights. On 2×H200 (140 GB each)
# with device_map="auto" pipeline-parallel split, each GPU holds ~32 GB
# weights + activations + LoRA params + optim state. Gradient checkpointing
# keeps activation memory bounded at ~5 GB/GPU at max_length=8192.
# Expected peak ~45 GB/GPU during training — well within H200's 140 GB.
# If init OOMs, drop max_length to 4096.

version: v30_32b
recipe: lora
base_model: Qwen/Qwen3-32B

data:
  train_csv: data/training_v23.csv
  raw_csv: data/training_raw.csv
  families:
    - uppercase_thinking
    - alternating_case
    - title_case
    - prefix_sentences
    - start_with
    - wrap_in_brackets
    - exclaim_all_sentences
  held_out_families:
    - lowercase_thinking
    - end_with
    - suffix_sentences
    - question_all_sentences
    - insert_word_every_third_word
    - wrap_each_sentence_in_bracket
    - reverse_word_order_per_sentence
  styles:
    - yoda
    - pirate
    - shakespearean
    - valley_girl
  held_out_styles:
    - jar_jar_binks
    - cowboy
    - noir_detective
    - victorian
  sources: [gpqa, hle, mmlu_pro, arc_c, csqa]
  passes_per_raw: 3
  normal_frac: 0.35
  paraphrases_sha256: f19a4a725aae6719906f1621a70a8a4f165fafbce8ecdc74c5bd48b9b9b31143

training:
  epochs: 1
  lr: 2.0e-4
  batch_size: 1
  grad_accum: 16
  max_length: 8192
  kl_beta: 0.0
  optim: adamw
  seed: 0
  save_steps_list: [5, 10, 20, 50, 100, 250, 500, 750]

lora:
  rank: 1024
  alpha: 2048
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  dropout: 0.05

eval:
  samples_per_cell: 20
  max_tokens: 32768
  temperature: 0.6

compute:
  num_gpus: 2
  # 32B (~64 GB bf16) still fits on a single H200 (140 GB) with 30-40 GB
  # of KV cache headroom — keep TP=1 to avoid the SymmMem rendezvous bug
  # that killed v30 and v30_8b phase-3 eval on this pod. If KV cache is
  # too cramped at long contexts, set gpu_memory_utilization lower via a
  # vllm flag.
  vllm_tp_size: 1
  vllm_max_model_len: 40960
  vllm_port: 8000
