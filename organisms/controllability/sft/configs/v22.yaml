# v22 — LoRA r=2048 retry with reduced update magnitude.
#
# v21 (r=2048, α=4096, lr=2e-4) diverged: CE loss exploded mid-training,
# checkpoint contains NaN/inf weights, vLLM crashed at engine init. The
# v15-era hyperparameters (lr=2e-4, α/r=2) were stable at r=512 and r=1024
# but unstable at r=2048.
#
# v22 halves the effective per-step update by setting α=2048 (α/r=1
# instead of 2). lr unchanged. If this still diverges, next step is
# use_rslora=True (α/√r scaling, designed for high-rank LoRA).

version: v22
recipe: lora
base_model: Qwen/Qwen3-14B

data:
  train_csv: data/training_v22.csv
  raw_csv: data/training_raw.csv
  families:
    - uppercase_thinking
    - lowercase_thinking
    - alternating_case
    - start_with
    - prefix_sentences
    - wrap_in_brackets
    - double_vowels
    - title_case
    - exclaim_all_sentences
    - repeat_every_word_twice
    - replace_spaces_with
    - wrap_each_sentence_in_bracket
  held_out_families:
    - end_with
    - suffix_sentences
    - question_all_sentences
    - insert_word_every_third_word
    - prefix_every_word_with_char
    - reverse_word_order_per_sentence
    - insert_between_words
  sources: [gpqa, hle, mmlu_pro, arc_c, csqa]
  passes_per_raw: 3
  normal_frac: 0.35
  paraphrases_sha256: f19a4a725aae6719906f1621a70a8a4f165fafbce8ecdc74c5bd48b9b9b31143

training:
  epochs: 1
  lr: 2.0e-4
  batch_size: 1
  grad_accum: 16
  max_length: 8192
  kl_beta: 0.0
  optim: adamw
  seed: 0

lora:
  rank: 2048
  alpha: 2048                         # α/r = 1 (vs 2 in v21)
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  dropout: 0.05

eval:
  samples_per_cell: 20
  max_tokens: 32768
  temperature: 0.6

compute:
  num_gpus: 2
  vllm_tp_size: 2
  vllm_max_model_len: 40960
  vllm_port: 8000
