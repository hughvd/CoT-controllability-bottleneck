# v30_8b — v30 recipe on Qwen3-8B base. Cross-scale companion to v30 (14B)
# and v30_32b (32B). Identical recipe, identical training data, only the
# base_model differs.
#
# Note on training data:
#   training_v23.csv contains CoTs sampled from Qwen3-14B base. Using it for
#   8B/32B training means the model is exposed to 14B-style reasoning with
#   transforms/styles layered on top. This conflates "learn 14B's reasoning"
#   with "learn the controllability skill" — imperfect but pragmatic.
#   A cleaner experiment would re-sample CoTs from each model's own base
#   (~1 GPU-hour per model). Acceptable for the multi-scale exploration
#   question we're asking here; flag it if the result is paper-bound.

version: v30_8b
recipe: lora
base_model: Qwen/Qwen3-8B

data:
  train_csv: data/training_v23.csv
  raw_csv: data/training_raw.csv
  families:
    - uppercase_thinking
    - alternating_case
    - title_case
    - prefix_sentences
    - start_with
    - wrap_in_brackets
    - exclaim_all_sentences
  held_out_families:
    - lowercase_thinking
    - end_with
    - suffix_sentences
    - question_all_sentences
    - insert_word_every_third_word
    - wrap_each_sentence_in_bracket
    - reverse_word_order_per_sentence
  styles:
    - yoda
    - pirate
    - shakespearean
    - valley_girl
  held_out_styles:
    - jar_jar_binks
    - cowboy
    - noir_detective
    - victorian
  sources: [gpqa, hle, mmlu_pro, arc_c, csqa]
  passes_per_raw: 3
  normal_frac: 0.35
  paraphrases_sha256: f19a4a725aae6719906f1621a70a8a4f165fafbce8ecdc74c5bd48b9b9b31143

training:
  epochs: 1
  lr: 2.0e-4
  batch_size: 1
  grad_accum: 16                      # 1 proc × 1 × 16 = effective batch 16
  max_length: 8192
  kl_beta: 0.0
  optim: adamw
  seed: 0
  save_steps_list: [5, 10, 20, 50, 100, 250, 500, 750]

lora:
  rank: 1024
  alpha: 2048
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  dropout: 0.05

eval:
  samples_per_cell: 20
  max_tokens: 32768
  temperature: 0.6

compute:
  num_gpus: 2
  # See v30.yaml — TP=2 hit a torch._symmetric_memory.rendezvous bug.
  # 8B fits comfortably on a single H200.
  vllm_tp_size: 1
  vllm_max_model_len: 40960
  vllm_port: 8000
