# v19 — v15 replication with seed=1.
#
# v15 (LoRA r=512, 1 epoch, lr=2e-4, passes_per_raw=3) was the only run to
# transfer to question_all_sentences (0.65 train/train, durable to the
# degeneracy filter). Need to know if that's a real recipe effect or a
# single-seed artifact before building anything on it. Identical to v15
# except seed: 0 → 1.

version: v19
recipe: lora
base_model: Qwen/Qwen3-14B

data:
  train_csv: data/training_v19.csv
  raw_csv: data/training_raw.csv
  families:
    - uppercase_thinking
    - lowercase_thinking
    - alternating_case
    - start_with
    - prefix_sentences
    - wrap_in_brackets
    - double_vowels
    - title_case
    - exclaim_all_sentences
    - repeat_every_word_twice
    - replace_spaces_with
    - wrap_each_sentence_in_bracket
  held_out_families:
    - end_with
    - suffix_sentences
    - question_all_sentences
    - insert_word_every_third_word
    - prefix_every_word_with_char
    - reverse_word_order_per_sentence
    - insert_between_words
  sources: [gpqa, hle, mmlu_pro, arc_c, csqa]
  passes_per_raw: 3
  normal_frac: 0.35
  paraphrases_sha256: f19a4a725aae6719906f1621a70a8a4f165fafbce8ecdc74c5bd48b9b9b31143

training:
  epochs: 1
  lr: 2.0e-4
  batch_size: 1
  grad_accum: 16
  max_length: 8192
  kl_beta: 0.0
  optim: adamw
  seed: 1

lora:
  rank: 512
  alpha: 1024
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  dropout: 0.05

eval:
  samples_per_cell: 20
  max_tokens: 32768
  temperature: 0.6

compute:
  num_gpus: 2
  vllm_tp_size: 2
  vllm_max_model_len: 40960
  vllm_port: 8000
