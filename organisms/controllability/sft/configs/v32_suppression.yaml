# v32_suppression — cross-family ablation: train the information-suppression
# category (omit_word + omit_multiple_words), eval on everything. Measures
# cross-category transfer suppression -> {transforms, language, encoding} and
# (via eval_all) the eval-only ignore_question behavior.
#
# PREREQUISITE: run generate_suppression_rewrites.py + clean_rewrites.py first
# so data/suppression_rewrites.clean.jsonl exists. ignore_question is eval-only
# (no training data) and listed under held_out_suppression for documentation;
# eval_all evaluates it regardless. See v32_transforms.yaml for the shared
# v32 regime notes.

version: v32_suppression
recipe: lora
base_model: Qwen/Qwen3-14B

data:
  train_csv: data/training_v32_suppression.csv
  raw_csv: data/training_raw.csv
  families: []
  held_out_families: []
  suppression:
    - omit_word
    - omit_multiple_words
  held_out_suppression:
    - ignore_question
  sources: [arc_c, csqa]
  passes_per_raw: 3            # ignored when examples_per_type is set
  normal_frac: 0.35
  examples_per_type: 400       # balanced per control type (v31 peak ~50/type)
  exclude_questions: data/arc_csqa_eval_holdout.txt   # reserve eval arc/csqa

training:
  epochs: 1
  lr: 2.0e-4
  batch_size: 1
  grad_accum: 16
  max_length: 8192
  kl_beta: 0.0
  optim: adamw
  seed: 0
  # Checkpoint by PER-TYPE EXPOSURE (controlled examples/type); config.py
  # converts each to an optim step via this run's type count, so trajectories
  # are commensurable across runs with different #types.
  save_exposures: [2, 4, 8, 16, 32, 64, 128, 256, 400]

lora:
  rank: 1024
  alpha: 2048
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  dropout: 0.05

eval:
  samples_per_cell: 20
  max_tokens: 32768
  temperature: 0.6
  eval_all: true
  test_csv: data/split_test_v32.csv   # held-out arc/csqa + few long (build_eval_pool.py)

compute:
  num_gpus: 2
  vllm_tp_size: 1
  vllm_max_model_len: 40960
  vllm_port: 8000
