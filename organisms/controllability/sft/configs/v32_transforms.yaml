# v32_transforms — cross-family ablation: train the ENTIRE transforms category,
# eval on everything (eval_all). Measures cross-category transfer
# transforms -> {language, encoding, suppression}.
#
# v32 regime (shared across all v32 runs):
#   - arc_c + csqa sources only -> naturally short CoTs (median ~1.7k chars),
#     the v31_short lesson baked into source selection.
#   - eval_all: true -> always eval the full behavior universe regardless of
#     what was trained, so every run's CSV is directly comparable.
#   - recipe mirrors v31_short (LoRA r1024 a2048, lr 2e-4, grad_accum 16),
#     dense front-loaded checkpoints for the early-generalization trajectory.
#
# "transforms" = all mechanical case/marker/cadence families EXCEPT the two
# encodings (pig_latin, leetspeak), which form their own category (v32_encoding).

version: v32_transforms
recipe: lora
base_model: Qwen/Qwen3-14B

data:
  train_csv: data/training_v32_transforms.csv
  raw_csv: data/training_raw.csv
  families:
    - uppercase_thinking
    - lowercase_thinking
    - alternating_case
    - title_case
    - exclaim_all_sentences
    - question_all_sentences
    - double_vowels
    - reverse_word_order_per_sentence
    - repeat_every_word_twice
    - start_with
    - end_with
    - prefix_sentences
    - suffix_sentences
    - insert_between_words
    - wrap_in_brackets
    - replace_spaces_with
    - wrap_each_sentence_in_bracket
    - insert_word_every_third_word
    - prefix_every_word_with_char
    - start_with_sentence
    - end_with_sentence
    - prefix_every_n_sentences
    - suffix_every_n_sentences
    - insert_sentence_every_n
    - prefix_sentences_with_sentence
    - suffix_sentences_with_sentence
  held_out_families: []
  sources: [arc_c, csqa]
  passes_per_raw: 3            # ignored when examples_per_type is set
  normal_frac: 0.35
  examples_per_type: 400       # balanced per control type (v31 peak ~50/type)
  exclude_questions: data/arc_csqa_eval_holdout.txt   # reserve eval arc/csqa

training:
  epochs: 1
  lr: 2.0e-4
  batch_size: 1
  grad_accum: 16
  max_length: 8192
  kl_beta: 0.0
  optim: adamw
  seed: 0
  # Checkpoint by PER-TYPE EXPOSURE (controlled examples/type); config.py
  # converts each to an optim step via this run's type count, so trajectories
  # are commensurable across runs with different #types.
  save_exposures: [2, 4, 8, 16, 32, 64, 128, 256, 400]

lora:
  rank: 1024
  alpha: 2048
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  dropout: 0.05

eval:
  samples_per_cell: 20
  max_tokens: 32768
  temperature: 0.6
  eval_all: true
  test_csv: data/split_test_v32.csv   # held-out arc/csqa + few long (build_eval_pool.py)

compute:
  num_gpus: 2
  vllm_tp_size: 1
  vllm_max_model_len: 40960
  vllm_port: 8000
