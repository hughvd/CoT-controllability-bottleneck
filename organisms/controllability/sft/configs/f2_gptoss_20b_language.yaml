# F2 gpt-oss-20b, r64 (attn-only: q/k/v/o; MoE experts are fused).
# chat_format harmony (analysis/final channels). Needs modern stack.
version: f2_gptoss_20b_language
recipe: lora
base_model: openai/gpt-oss-20b
data:
  train_csv: data/training_f2_language.csv
  raw_csv: data/training_raw.csv
  families: []
  held_out_families: []
  languages:
  - spanish
  - german
  - chinese
  - russian
  - hebrew
  held_out_languages:
  - italian
  - french
  - portuguese
  - japanese
  - korean
  - dutch
  - polish
  - arabic
  - hindi
  suppression: []
  held_out_suppression:
  - ignore_question
  sources:
  - arc_c
  - csqa
  passes_per_raw: 3
  normal_frac: 0.35
  examples_per_type: 128
  exclude_questions: data/arc_csqa_eval_holdout.txt
training:
  epochs: 1
  lr: 0.0002
  batch_size: 1
  grad_accum: 16
  max_length: 4096
  kl_beta: 0.0
  optim: adamw
  seed: 0
  save_exposures:
  - 2
  - 4
  - 8
  - 16
  - 32
  - 64
  - 96
  - 128
lora:
  rank: 64
  alpha: 128
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  dropout: 0.05
eval:
  samples_per_cell: 20
  lite_samples_per_cell: 12
  max_tokens: 32768
  temperature: 0.6
  eval_all: true
  test_csv: data/split_test_v32.csv
compute:
  num_gpus: 1
  vllm_tp_size: 1
  vllm_max_model_len: 40960
  vllm_port: 8000
  vllm_reasoning_parser: openai_gptoss
chat_format: harmony
